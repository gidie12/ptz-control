name: Losse app bouwen

# Bouwt "PTZ Control.exe" (Windows) en "PTZ Control.app" (macOS, Apple-chip).
# - Handmatig: Actions → "Losse app bouwen" → Run workflow.
#     Zonder vinkje: alleen bouwen (bestanden onder Artifacts).
#     Met "Release maken": GitHub maakt zelf een tag en een release met beide downloads.
#       Versieveld leeg = automatisch de volgende versie (nieuwste tag v1.2.3 → v1.2.4; nog geen tag → v1.0.0).
#       Zelf invullen (bv. 2.0.0) mag ook.
# - Of zelf een tag v* pushen: ook een release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release maken (tag + downloads bij Releases)"
        type: boolean
        default: false
      versie:
        description: "Versie (leeg = automatisch volgende, bv. v1.0.3 → v1.0.4)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  versie:
    runs-on: ubuntu-latest
    outputs:
      versie: ${{ steps.v.outputs.versie }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # alle tags, om de nieuwste te vinden
      - name: Versie bepalen
        id: v
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          INVOER: ${{ inputs.versie }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          elif [ "$RELEASE" = "true" ]; then
            invoer="${INVOER#v}"; invoer="${invoer// /}"
            if [ -n "$invoer" ]; then
              if ! [[ "$invoer" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Versie '$INVOER' klopt niet; gebruik bv. 1.0.4 of laat het veld leeg"; exit 1
              fi
              v="v$invoer"
            else
              laatste=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
              if [ -z "$laatste" ]; then v="v1.0.0"
              else IFS=. read -r a b c <<< "${laatste#v}"; v="v$a.$b.$((c + 1))"; fi
              echo "Nieuwste tag: ${laatste:-geen}"
            fi
            if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
              echo "::error::Tag $v bestaat al; vul een hogere versie in of laat het veld leeg"; exit 1
            fi
          else
            v="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "Versie: $v"
          echo "versie=$v" >> "$GITHUB_OUTPUT"
          # releasenotes = docs/releasenotes/<versie>.md als die bestaat, anders de commitonderwerpen sinds de vorige tag
          # (de app toont de "- "-regels in de updatemelding)
          vorige=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | grep -vx "$v" | tail -1)
          {
            echo "notes<<NOTES_EOF"
            if [ -f "docs/releasenotes/$v.md" ]; then cat "docs/releasenotes/$v.md"   # zelf geschreven notes gaan voor
            elif [ -n "$vorige" ]; then git log --no-merges --format='- %s' -n 30 "$vorige..HEAD"; else git log --no-merges --format='- %s' -n 30; fi
            echo
            echo "Alle wijzigingen: https://github.com/${GITHUB_REPOSITORY}/compare/${vorige:-HEAD}...$v"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "### Versie: $v" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: versie
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: windows
          - os: macos-15            # Apple Silicon (arm64), zoals de Mac mini (macos-14 is per 2 nov 2026 uitgefaseerd)
            naam: macos
    runs-on: ${{ matrix.os }}
    env:
      PTZ_VERSION: ${{ needs.versie.outputs.versie }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bouwpakketten installeren
        run: pip install -r packaging/requirements-build.txt

      - name: Snelle controle
        run: python -m py_compile ptz_control.py tracker.py backup.py youtube.py

      - name: Persoonsdetector ophalen en testen (half silhouet)
        shell: bash
        run: |
          python packaging/haal_model.py
          # testfoto (twee mannen, alleen bovenlichaam) uit het ultralytics-pakket; gaat niet mee in de app
          pip download --no-deps -q ultralytics -d testfoto
          python -c "import zipfile,glob;zipfile.ZipFile(glob.glob('testfoto/*.whl')[0]).extract('ultralytics/assets/zidane.jpg','testfoto')"
          python packaging/test_detector.py testfoto/ultralytics/assets/zidane.jpg 2

      - name: App bouwen
        run: pyinstaller --noconfirm packaging/ptz_control.spec

      - name: Rooktest (Windows)
        if: matrix.naam == 'windows'
        shell: pwsh
        run: |
          $env:PTZ_INSTALL = "0"
          $env:PTZ_DATA = "$env:RUNNER_TEMP\ptzdata"
          $p = Start-Process -FilePath "dist\PTZ Control.exe" -ArgumentList "--no-open","--no-tray","--port","8765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ ; if ($r.Content -match "PTZ Control") { $ok = $true; break } } catch {}
          }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/quit -Body "{}" -ContentType "application/json" -ErrorAction SilentlyContinue | Out-Null
          if (-not $ok) { Get-Content "$env:PTZ_DATA\ptz_control.log" -ErrorAction SilentlyContinue; throw "App reageert niet" }
          Write-Host "Rooktest geslaagd"

      - name: Rooktest (macOS)
        if: matrix.naam == 'macos'
        run: |
          export PTZ_DATA="$RUNNER_TEMP/ptzdata"
          "dist/PTZ Control.app/Contents/MacOS/PTZ Control" --no-open --no-tray --port 8765 &
          for i in $(seq 1 40); do sleep 1; curl -fs http://127.0.0.1:8765/ | grep -q "PTZ Control" && ok=1 && break; done
          curl -fs -X POST -d '{}' http://127.0.0.1:8765/api/quit || true
          if [ -z "$ok" ]; then cat "$PTZ_DATA/ptz_control.log" || true; exit 1; fi
          echo "Rooktest geslaagd"

      - name: Inpakken (Windows)
        if: matrix.naam == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\PTZ Control.exe" "out\PTZ-Control-${env:PTZ_VERSION}-Windows.exe"

      - name: Inpakken (macOS)
        if: matrix.naam == 'macos'
        run: |
          # ad-hoc ondertekenen (geen Apple-ontwikkelaarsaccount); nodig voor Apple-chip
          codesign --force --deep --sign - "dist/PTZ Control.app"
          mkdir -p out
          ditto -c -k --keepParent "dist/PTZ Control.app" "out/PTZ-Control-${PTZ_VERSION}-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PTZ-Control-${{ matrix.naam }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.release
    needs: [versie, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          # bij Run workflow maakt deze stap de tag zelf aan op de gebouwde commit
          tag_name: ${{ needs.versie.outputs.versie }}
          name: PTZ Control ${{ needs.versie.outputs.versie }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.versie.outputs.notes }}
